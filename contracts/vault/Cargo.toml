[package]
name = "vault"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
# Real ed25519 signatures in the quote-signer tests. A hardcoded signature
# blob would pin one byte string rather than the property, and could not show
# that TAMPERING with the binding is what the gate rejects.
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
default = []
# Shortens the budget window so the day-boundary test is deterministic.
# NON-DEFAULT ON PURPOSE. `clock_mode()` reports a distinct string when this
# is on, and scripts/deploy-testnet.sh refuses to proceed if it sees it.
test-clock = []
