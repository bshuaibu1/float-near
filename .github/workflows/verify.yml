# WHY THIS FILE EXISTS.
#
# It did not, for 589 commits. An independent review of this repo recorded that
# as the single clearest weakness, and it was right for a worse reason than "no
# badge": `node scripts/verify-all.mjs` is declared THE gate in CLAUDE.md, and
# enumerating what it actually runs shows no `cargo test` anywhere. So the
# contract -- the only thing in this project that enforces a spending limit --
# was the one component nothing gated. Six create-float tests were failing on
# `main` at submission time and the gate could not see them.
#
# Three jobs, and the split is deliberate:
#
#   contracts     the enforcement logic. Fast, no Node, no network.
#   gate          the 42 checks, which include 12 mutation suites.
#   integration   near-workspaces sandbox tests, NON-BLOCKING -- see below.
#
# `contracts` and `gate` gate the branch. `integration` does not, yet.
#
# Those tests had NEVER RUN ANYWHERE: near-workspaces ships no Windows sandbox
# binary and this project is developed on Windows, so CI is the first machine
# that could execute them at all. As of 2026-11-15 they do, and they pass --
# **45 tests across 12 suites, 0 failures**, which is twice what anyone thought
# was in there. Getting there took three tries and the failures were all
# plumbing: `res/` is untracked so the wasm had to be built
# (scripts/build-wasm.sh), and cargo-near will not install without libudev.
#
# It stays non-blocking for now on purpose. One green run is not a record, and
# this job downloads a sandbox binary over the network -- the most flake-prone
# thing in the whole workflow. Promote it after it has been green for a few
# runs, not because it went green once the week of judging.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: contracts (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: rust-toolchain.toml pins channel 1.99.1 and the
      # wasm32 target, and rustup honours it on the first cargo invocation.
      # Pinning it a second time here is how the two drift apart.
      - name: Show toolchain
        run: rustc --version && cargo --version

      # SCOPED WITH -p ON PURPOSE. A bare `cargo test` builds every workspace
      # member including contracts/integration-tests, whose near-workspaces
      # build script downloads a sandbox -- so one flaky download would fail
      # the job that is supposed to answer "does the contract still enforce
      # the limits". Those tests have their own job.
      - name: Unit tests
        run: cargo test -p vault -p factory -p mock-ft

      # Informational. The repo has pre-existing clippy warnings; `-D warnings`
      # would fail the job without telling anyone anything new. Left visible so
      # the count is tracked rather than hidden, and can be driven to zero.
      - name: Clippy (informational)
        continue-on-error: true
        run: cargo clippy -p vault -p factory -p mock-ft --all-targets

      # Also informational, and verified as such before being written: this
      # repo currently has a rustfmt diff in contracts/factory/src/lib.rs, so
      # `--check` exits 1. Running `cargo fmt` to clear it would rewrite
      # contract source, which moves the sources digest and puts
      # packages/create-float/res/vault.wasm back into the provenance-drift
      # state this branch just got out of. Not worth it the week of judging;
      # format and re-record together, deliberately, afterwards.
      - name: Formatting (informational)
        continue-on-error: true
        run: cargo fmt --check -p vault -p factory -p mock-ft

  gate:
    name: gate (verify-all, 42 checks)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 IS LOAD-BEARING. actions/checkout defaults to a depth-1
      # clone with no other refs, and two of the 42 checks resolve `main`:
      # check-state-stamp.mjs asks what has LANDED (deliberately comparing
      # against the default branch, not HEAD), and the script-reference check
      # walks git refs. On a shallow clone both report BROKEN / "UNRESOLVABLE
      # GIT REF main" -- a clone artifact that reads exactly like a real
      # ledger failure. Measured on the first run of this workflow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspaces
        run: npm ci

      # THE GATE DOES NOT BUILD, IT ONLY CHECKS. `dist/` is gitignored, so on a
      # fresh clone six checks fail for one reason: there is nothing compiled to
      # check. They do not SAY that -- they say "Cannot find module
      # '@floatonnear/mcp/sign'", "mcp gas math missing at .../dist/gas-math.js"
      # and "is not built; cannot check the skill against real tools". It passes
      # on a dev machine purely because dist/ is already lying there from
      # earlier work, which is the oldest shape of false green there is.
      - name: Build workspaces
        run: npm run build

      # A build that silently produced nothing would cascade into the same six
      # failures and send the next person hunting the wrong bug. Fail here, with
      # the real reason, instead.
      - name: Assert the build actually emitted
        run: |
          for f in packages/mcp/dist/server.js packages/mcp/dist/gas-math.js; do
            test -s "$f" || { echo "build emitted no $f"; exit 1; }
          done
          echo "build output present"

      # apps/dashboard IS NOT A WORKSPACE. The root package.json lists only
      # `packages/*`, so the root install leaves the dashboard with no
      # node_modules and three of the gate's checks (typecheck, build, tests)
      # fail on a fresh clone for purely environmental reasons. A reviewer hit
      # exactly that and had to work out that the failures were not real.
      - name: Install dashboard
        working-directory: apps/dashboard
        run: npm ci

      - name: THE gate
        run: node scripts/verify-all.mjs

  integration:
    name: integration (near-workspaces, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version
      # THE PREREQUISITE, which the first run of this job discovered.
      #
      # The tests COMPILED and RAN on Linux first time -- then failed on
      # "No such file or directory (os error 2)", because they load wasm out of
      # `res/`, and `res/` is UNTRACKED. It exists only on a machine that has
      # run this script. contracts/integration-tests/tests/concurrency.rs says
      # so in its own header: "Prerequisite: scripts/build-wasm.sh".
      #
      # cargo-near is pinned to the version that built the artifacts currently
      # on the author's disk, so CI is not silently testing a different
      # compiler's output. It builds WITH test-clock on purpose -- the
      # day-boundary tests need a short budget window -- which is also why that
      # wasm must never be deployed.
      # cargo-near depends on hidapi (Ledger support), which needs libudev.
      # Without it `cargo install` dies on "Package 'libudev' not found" --
      # nothing to do with this project, but it stops the job before it reaches
      # a single test.
      - name: System deps for cargo-near
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libudev-dev pkg-config

      - name: Install cargo-near
        run: cargo install cargo-near --locked --version 0.22.0

      - name: Build the sandbox wasm
        run: bash scripts/build-wasm.sh

      - name: Sandbox tests
        run: cargo test -p integration-tests
